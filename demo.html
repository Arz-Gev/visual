<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ascii-art demo</title>
  <!-- 1. one script tag (local copy; or https://www.ascii-magic.com/ascii/ascii.js) -->
  <script type="module" src="ascii-magic-art/runtime/ascii.js"></script>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; padding: 24px; }
    section { margin-bottom: 32px; }
    code { color: #79c0ff; }
  </style>
</head>
<body>
  <!-- 2. then the tag, anywhere -->
  <section>
    <p><code>&lt;ascii-art piece="moonlit-sea"&gt;&lt;/ascii-art&gt;</code></p>
    <ascii-art piece="moonlit-sea"></ascii-art>
  </section>

  <section>
    <p><code>&lt;ascii-art piece="spinning-torus" look="dots" size="10"&gt;&lt;/ascii-art&gt;</code></p>
    <ascii-art piece="spinning-torus" look="dots" size="10"></ascii-art>
  </section>

  <section>
    <p><code>&lt;ascii-art piece="matrix-rain" speed="2"&gt;&lt;/ascii-art&gt;</code></p>
    <ascii-art piece="matrix-rain" speed="2"></ascii-art>
  </section>

  <section>
    <p><code>&lt;ascii-art piece="sleeping-cat" still&gt;&lt;/ascii-art&gt;</code></p>
    <ascii-art piece="sleeping-cat" still></ascii-art>
  </section>
</body>
</html>
